<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'>
  <defs>
    <!-- Light Neutral Grey to Soft White Gradient -->
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#f6f8fa' />
      <stop offset='100%' stop-color='#e1e4e8' />
    </linearGradient>

    <!-- Deep Modern Purple for Bin Lid -->
    <linearGradient id='accentGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#8a63d2' />
      <stop offset='100%' stop-color='#6f42c1' />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='8' stdDeviation='12' flood-color='#000000' flood-opacity='0.15' />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width='512' height='512' fill='url(#bgGrad)'/>

  <!-- Main Icon Group with Soft Shadow -->
  <g filter='url(#shadow)'>
    <!-- Bin Base Body (Dark Charcoal for High Contrast on Light Background) -->
    <path d='M 136 180 L 376 180 L 346 420 C 344 432 334 440 322 440 L 190 440 C 178 440 168 432 166 420 Z' 
          fill='#0d1117' stroke='#1b1f24' stroke-width='8' stroke-linejoin='round'/>

    <!-- Bin Lid with Vibrant Purple Accent -->
    <rect x='104' y='110' width='304' height='70' fill='url(#accentGrad)' stroke='#586069' stroke-width='4' rx='16'/>

    <!-- Sleek Top Handle -->
    <path d='M 210 110 C 210 92 224 82 256 82 C 288 82 302 92 302 110' fill='none' stroke='#ffffff' stroke-width='10' stroke-linecap='round'/>

    <!-- Code Brackets inside Bin Body (Light Pastel Cyan & Purple) -->
    <!-- Left Bracket < -->
    <path d='M 210 260 L 175 295 L 210 330' fill='none' stroke='#8b949e' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/>
    <!-- Forward Slash / -->
    <path d='M 264 250 L 246 340' fill='none' stroke='#d8c5fc' stroke-width='16' stroke-linecap='round'/>
    <!-- Right Bracket > -->
    <path d='M 302 260 L 337 295 L 302 330' fill='none' stroke='#8b949e' stroke-width='16' stroke-linecap='round' stroke-linejoin='round'/>
  </g>
</svg>