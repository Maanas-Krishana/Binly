<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Subtle corner rounded mask for standalone PWA icon -->
    <clipPath id="squircle">
      <rect width="512" height="512" rx="100" />
    </clipPath>
  </defs>

  <!-- Clean Warm Background -->
  <rect width="512" height="512" fill="#fcfaf6" rx="100" />
  <rect width="512" height="512" fill="none" stroke="#1f2328" stroke-width="12" rx="100" />

  <!-- Centered Original Binly Icon Geometry -->
  <g transform="translate(256, 256) scale(9.2) translate(-18, -19)">
    <!-- Solid Black Drop Shadow -->
    <path d="M 4 10 L 32 10 L 28 38 L 8 38 Z" fill="#000000" transform="translate(2.8, 2.8)"/>
    <rect x="-2" y="-2" width="40" height="8" fill="#000000" rx="1.5" transform="translate(2.8, 2.8)"/>

    <!-- Bin Body -->
    <path d="M 4 10 L 32 10 L 28 38 L 8 38 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Bin Lid (Lilac Accent #c5b3e6) -->
    <rect x="-2" y="-2" width="40" height="8" fill="#c5b3e6" stroke="#000000" stroke-width="2.5" rx="1.5"/>

    <!-- Code Brackets < > -->
    <path d="M 12 18 L 8 24 L 12 30 M 24 18 L 28 24 L 24 30" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>