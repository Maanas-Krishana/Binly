<svg xmlns='http://www.w3.org/2000/svg' width='192' height='192' viewBox='0 0 512 512'>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#161b22' />
      <stop offset='50%' stop-color='#0d1117' />
      <stop offset='100%' stop-color='#080b0e' />
    </linearGradient>

    <!-- Accent Gradient for Bin Cover -->
    <linearGradient id='accentGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#d8c5fc' />
      <stop offset='100%' stop-color='#b197e4' />
    </linearGradient>

    <!-- Glow Effect for Code Symbol -->
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur' />
      <feComposite in='SourceGraphic' in2='blur' operator='over' />
    </filter>
  </defs>

  <!-- Safe Area Outer Fill for Maskable Icons -->
  <rect width='512' height='512' fill='url(#bgGrad)'/>

  <!-- Subtle Inner Container Glass Card -->
  <rect x='64' y='64' width='384' height='384' rx='72' fill='#1f242c' fill-opacity='0.5' stroke='#30363d' stroke-width='4'/>

  <!-- Bin Container Base Body -->
  <path d='M 128 180 L 384 180 L 352 420 C 350 432 340 440 328 440 L 184 440 C 172 440 162 432 160 420 Z' 
        fill='#161b22' stroke='#ffffff' stroke-width='14' stroke-linejoin='round'/>

  <!-- Bin Lid with Accent Purple Gradient -->
  <rect x='96' y='110' width='320' height='70' fill='url(#accentGrad)' stroke='#ffffff' stroke-width='14' rx='16'/>

  <!-- Code Bracket Symbols inside Bin Body (Gold / Neon Cyan Accent) -->
  <g filter='url(#glow)'>
    <!-- Left Bracket < -->
    <path d='M 210 260 L 170 300 L 210 340' fill='none' stroke='#6e7681' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/>
    <!-- Forward Slash / -->
    <path d='M 266 250 L 246 350' fill='none' stroke='#d8c5fc' stroke-width='18' stroke-linecap='round'/>
    <!-- Right Bracket > -->
    <path d='M 302 260 L 342 300 L 302 340' fill='none' stroke='#6e7681' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/>
  </g>

  <!-- Sleek Top Handle on Lid -->
  <path d='M 206 110 C 206 90 220 80 256 80 C 292 80 306 90 306 110' fill='none' stroke='#ffffff' stroke-width='12' stroke-linecap='round'/>
</svg>